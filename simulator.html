{% extends "base.html" %}
{% block content %}
<h1>URI Simulator</h1>
<div class="panel">
  <label for="sim-uri">AT URI</label>
  <input id="sim-uri" type="text" placeholder="at://did:plc:abc123/app.bsky.feed.post/3k2abc"
         value="at://did:plc:abc123/app.bsky.feed.post/3k2abc">
  <label for="sim-strategy">Parsing strategy</label>
  <select id="sim-strategy">
    {% for s in strategies %}<option value="{{s}}">{{s}}</option>{% endfor %}
  </select>
  <div class="actions">
    <button class="btn primary" id="btn-validate">Validate</button>
    <button class="btn" id="btn-roundtrip">Round-Trip</button>
    <button class="btn" id="btn-reset">Reset</button>
  </div>
</div>
<div id="sim-output" class="panel hidden">
  <h3>Result</h3>
  <pre id="sim-result"></pre>
</div>
{% endblock %}
