{% extends "base.html" %}
{% block content %}
<h1>Batch Testing</h1>
<div class="panel">
  <label for="batch-input">One URI per line, or import a .txt file</label>
  <textarea id="batch-input" rows="10" placeholder="at://did:plc:abc123/app.bsky.feed.post/x
at://alice.bsky.social/app.bsky.feed.like/y
at://did:web:example.com/col/rkey"></textarea>
  <input type="file" id="batch-file" accept=".txt,.csv">
  <div class="actions">
    <button class="btn primary" id="btn-batch">Run batch</button>
    <button class="btn" id="btn-batch-clear">Clear</button>
  </div>
</div>
<div id="batch-summary" class="stat-grid hidden">
  <div class="stat"><span class="stat-value" id="b-total">–</span><span class="stat-label">URIs tested</span></div>
  <div class="stat"><span class="stat-value warn" id="b-conflicts">–</span><span class="stat-label">With conflicts</span></div>
  <div class="stat"><span class="stat-value err" id="b-rt">–</span><span class="stat-label">Round-trip failures</span></div>
</div>
<table id="batch-table" class="data-table hidden">
  <thead><tr><th>URI</th><th>Valid (std)</th><th>Authority</th><th>Conflicts</th><th>Reconstructed</th></tr></thead>
  <tbody></tbody>
</table>
{% endblock %}batch.html
