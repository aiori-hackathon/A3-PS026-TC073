{% extends "base.html" %}
{% block content %}
<h1>Test-Case Library</h1>
<div class="panel">
  <input id="lib-search" type="search" placeholder="Search by ID, input, or purpose">
  <select id="lib-category">
    <option value="">All categories</option>
    <option>valid</option><option>invalid</option><option>did_colon</option>
    <option>handle</option><option>path</option><option>encoding</option>
    <option>unicode</option><option>malformed</option><option>conflict</option>
    <option>boundary</option>
  </select>
  <select id="lib-status">
    <option value="">All statuses</option>
    <option>pass</option><option>fail</option><option>review</option>
  </select>
  <button class="btn primary" id="btn-lib-run">Run all cases</button>
</div>
<p class="muted" id="lib-count"></p>
<table id="lib-table" class="data-table">
  <thead><tr>
    <th>ID</th><th>Input</th><th>Category</th><th>Expected</th>
    <th>Status</th><th>Valid</th><th>Purpose</th>
  </tr></thead>
  <tbody></tbody>
</table>
{% endblock %}
