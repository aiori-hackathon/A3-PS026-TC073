{% extends "base.html" %}
{% block content %}
<h1>Parser Comparison</h1>
<div class="panel">
  <label for="cmp-uri">AT URI</label>
  <input id="cmp-uri" type="text"
         value="at://did:web:example.com:8080/app.bsky.feed.post/3k2abc">
  <button class="btn primary" id="btn-compare">Compare strategies</button>
</div>
<div id="cmp-output" class="hidden">
  <h2>Per-strategy results</h2>
  <table id="cmp-table" class="data-table">
    <thead><tr>
      <th>Strategy</th><th>Valid</th><th>Authority</th>
      <th>Collection</th><th>RKey</th><th>Reconstructed</th><th>Errors</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <h2>Conflicts detected</h2>
  <div id="cmp-conflicts" class="panel"></div>
</div>
{% endblock %}
