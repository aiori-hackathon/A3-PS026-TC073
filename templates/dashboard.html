{% extends "base.html" %}
{% block content %}
<h1>Dashboard</h1>
<p class="muted">Statistics computed live from the built-in corpus on each page load.</p>
<div id="dashboard-stats" class="stat-grid">
  <div class="stat"><span class="stat-value" id="s-total">–</span><span class="stat-label">Total cases</span></div>
  <div class="stat"><span class="stat-value ok" id="s-pass">–</span><span class="stat-label">Passed</span></div>
  <div class="stat"><span class="stat-value err" id="s-fail">–</span><span class="stat-label">Failed</span></div>
  <div class="stat"><span class="stat-value warn" id="s-review">–</span><span class="stat-label">Needs review</span></div>
  <div class="stat"><span class="stat-value" id="s-rate">–</span><span class="stat-label">Pass rate</span></div>
</div>
<h2>Conflict summary</h2>
<div id="conflict-summary" class="panel">Loading…</div>
<h2>Recent cases</h2>
<table id="recent-table" class="data-table">
  <thead><tr><th>ID</th><th>Input</th><th>Category</th><th>Expected</th><th>Status</th></tr></thead>
  <tbody></tbody>
</table>
{% endblock %}
