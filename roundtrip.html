{% extends "base.html" %}
{% block content %}
<h1>Round-Trip Analysis</h1>
<div class="panel">
  <input id="rt-uri" type="text"
         value="at://did:plc:abc123/app.bsky.feed.post/3k2abc">
  <select id="rt-strategy">
    {% for s in strategies %}<option value="{{s}}">{{s}}</option>{% endfor %}
  </select>
  <button class="btn primary" id="btn-rt">Run round-trip</button>
</div>
<div id="rt-output" class="hidden panel">
  <p><strong>Original:</strong> <code id="rt-original"></code></p>
  <p><strong>Reconstructed:</strong> <code id="rt-reconstructed"></code></p>
  <p><strong>Exact match:</strong> <span id="rt-match"></span></p>
  <h3>Parsed components</h3>
  <pre id="rt-parsed"></pre>
</div>
{% endblock %}
